# Практическая работа №3, шаг 6: приложение + БД + миграции.
# app стартует только после того, как БД прошла healthcheck
# и сервис migrate успешно применил миграции.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипт создаёт тестовую БД tasks_test при первом запуске тома.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    # БД считается готовой, когда pg_isready отвечает успехом.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Одноразовый сервис: применяет миграции Alembic и завершается.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

  # Само приложение (uvicorn на порту 8000).
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Тесты внутри Compose: запускаются только командой
  # docker compose --profile test run --rm tests (без профиля сервис не стартует).
  tests:
    image: python:3.12-slim
    profiles: [test]
    working_dir: /src
    # Код монтируется с хоста, образ приложения для тестов не нужен.
    volumes:
      - .:/src
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks_test
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/tasks_test
      # Не писать .pyc и кэш pytest в смонтированную папку проекта.
      PYTHONDONTWRITEBYTECODE: "1"
    command: sh -c "pip install -q --root-user-action=ignore -r requirements-dev.txt && pytest -v -p no:cacheprovider"
    depends_on:
      db:
        condition: service_healthy

# Том с данными PostgreSQL — данные переживают перезапуск контейнера.
volumes:
  pgdata:
