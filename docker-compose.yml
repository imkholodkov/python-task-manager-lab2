# Задание, шаг 2: PostgreSQL 16 в Docker. Содержимое — один в один из задания.
# Запуск: docker compose up -d db
# Проверка: docker compose exec db psql -U app -d tasks -c "select 1"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tasks
    ports: ["5432:5432"]
    # Данные хранятся в именованном томе pgdata и переживают перезапуск контейнера.
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
